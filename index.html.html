<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>bono.eng — Engineering Collective</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#07080b;--bg2:#0d0f14;--card:rgba(255,255,255,.04);--line:rgba(255,255,255,.09);
  --tx:#eef1f6;--mu:#98a1b3;--ac:#7cf5c8;--ac2:#6b8cff;--glow:rgba(124,245,200,.25);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#07080b;--tx:#eef1f6}}
html{scroll-padding-top:80px;scroll-behavior:smooth}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Cairo','Space Grotesk',system-ui,sans-serif;line-height:1.7;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(600px 400px at 85% -5%,var(--glow),transparent 70%),radial-gradient(700px 500px at 5% 40%,rgba(107,140,255,.14),transparent 70%),
  linear-gradient(var(--line) 1px,transparent 1px) 0 0/56px 56px,linear-gradient(90deg,var(--line) 1px,transparent 1px) 0 0/56px 56px;
  -webkit-mask-image:radial-gradient(ellipse at 50% 20%,#000 20%,transparent 75%);mask-image:radial-gradient(ellipse at 50% 20%,#000 20%,transparent 75%);opacity:.9}
.wrap{max-width:1160px;margin:0 auto;padding:0 20px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);background:rgba(7,8,11,.7);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;justify-content:space-between;height:68px;gap:12px}
.logo{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:22px;letter-spacing:-.5px;direction:ltr;text-decoration:none;color:var(--tx)}
.logo b{color:var(--ac)}
.links{display:flex;gap:26px}
.links a{color:var(--mu);text-decoration:none;font-weight:600;font-size:15px;transition:.2s}
.links a:hover{color:var(--ac)}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--card);direction:ltr}
.lang button{border:0;background:none;color:var(--mu);font:700 13px 'Space Grotesk',sans-serif;padding:6px 14px;border-radius:999px;cursor:pointer;transition:.25s}
.lang button.on{background:var(--ac);color:#04110c}
section{padding:90px 0}
.hero{padding:90px 0 60px;text-align:center}
.pill{display:inline-flex;gap:8px;align-items:center;border:1px solid var(--line);background:var(--card);padding:7px 16px;border-radius:999px;font-size:14px;color:var(--mu);margin-bottom:26px}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--ac);box-shadow:0 0 12px var(--ac);animation:pulse 1.8s infinite}
@keyframes pulse{50%{opacity:.35}}
h1{font-size:clamp(34px,6.4vw,76px);line-height:1.15;margin:0 auto 22px;font-weight:900;max-width:960px}
h1 em{font-style:normal;background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{max-width:720px;margin:0 auto 34px;color:var(--mu);font-size:clamp(16px,2vw,20px)}
.btn{display:inline-block;border:0;cursor:pointer;font:800 16px 'Cairo',sans-serif;padding:15px 34px;border-radius:14px;background:linear-gradient(135deg,var(--ac),#4fd6ff);color:#04110c;box-shadow:0 10px 40px -10px var(--glow);transition:.25s;text-decoration:none}
.btn:hover{transform:translateY(-3px);box-shadow:0 16px 50px -8px var(--glow)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:64px}
.glass{background:var(--card);border:1px solid var(--line);border-radius:22px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.stat{padding:26px 14px}
.stat strong{display:block;font:700 clamp(28px,4vw,44px) 'Space Grotesk',sans-serif;color:var(--ac);direction:ltr}
.stat span{color:var(--mu);font-size:14px}
.sec-h{text-align:center;margin-bottom:46px}
.sec-h h2{font-size:clamp(28px,4.4vw,46px);margin:0 0 10px;font-weight:900}
.sec-h p{color:var(--mu);margin:0 auto;max-width:620px}
.about{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.about .glass{padding:28px;transition:.3s}
.about .glass:hover{border-color:var(--ac);transform:translateY(-4px)}
.about .ic{font-size:28px;margin-bottom:10px}
.about h3{margin:0 0 6px;font-size:20px}
.about p{margin:0;color:var(--mu);font-size:15px}
.pk{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;align-items:stretch}
.pkg{position:relative;padding:32px 26px;display:flex;flex-direction:column;transition:.3s}
.pkg:hover{transform:translateY(-6px)}
.pkg.pro{border-color:rgba(107,140,255,.6);background:linear-gradient(180deg,rgba(107,140,255,.12),var(--card))}
.pkg.ultra{border-color:var(--ac);background:linear-gradient(180deg,rgba(124,245,200,.14),var(--card));box-shadow:0 0 70px -20px var(--glow);transform:scale(1.04)}
.pkg.ultra:hover{transform:scale(1.04) translateY(-6px)}
.badge{position:absolute;top:-14px;inset-inline-start:50%;transform:translateX(-50%);background:var(--ac);color:#04110c;font-weight:800;font-size:13px;padding:4px 16px;border-radius:999px;white-space:nowrap}
[dir=rtl] .badge{transform:translateX(50%)}
.pkg .n{color:var(--mu);font-weight:600;font-size:14px}
.pkg h3{margin:4px 0 14px;font-size:24px}
.price{font:700 44px 'Space Grotesk',sans-serif;direction:ltr;display:inline-block;color:var(--tx)}
.price small{font:600 15px 'Cairo',sans-serif;color:var(--mu);margin-inline-start:6px}
.time{margin:12px 0 18px;padding:9px 14px;border-radius:12px;background:rgba(255,255,255,.05);font-size:14px;color:var(--ac);font-weight:700}
.pkg ul{list-style:none;padding:0;margin:0 0 26px;flex:1}
.pkg li{padding:7px 0;color:var(--mu);font-size:15px;display:flex;gap:10px}
.pkg li::before{content:"✓";color:var(--ac);font-weight:800}
.pkg .btn{width:100%;text-align:center}
.pkg:not(.ultra) .btn{background:var(--card);color:var(--tx);border:1px solid var(--line);box-shadow:none}
.pkg:not(.ultra) .btn:hover{border-color:var(--ac);color:var(--ac)}
.pkg.pro .btn{background:linear-gradient(135deg,var(--ac2),#9a7bff);color:#fff;border:0}
#contact .cta{text-align:center;padding:50px 24px}
#contact h2{margin:0 0 10px;font-size:clamp(26px,4vw,40px)}
#contact p{color:var(--mu);margin:0 0 24px}
footer{border-top:1px solid var(--line);padding:26px 0;text-align:center;color:var(--mu);font-size:14px}
.rv{opacity:0;transform:translateY(26px);transition:opacity .7s,transform .7s}
.rv.in{opacity:1;transform:none}
.pkg.ultra.rv.in{transform:scale(1.04)}
/* modal */
.ov{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(3,4,6,.8);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.ov.open{display:flex}
.modal{width:100%;max-width:540px;max-height:calc(100% - 20px);overflow-y:auto;background:var(--bg2);border:1px solid var(--line);border-radius:24px;padding:28px;animation:pop .35s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{opacity:0;transform:translateY(24px) scale(.96)}}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.mh h3{margin:0;font-size:22px}
.x{border:1px solid var(--line);background:var(--card);color:var(--tx);width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:18px}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px}
.sum div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center;font-size:12px;color:var(--mu)}
.sum b{display:block;color:var(--ac);font-size:15px;margin-top:2px}
label{display:block;font-weight:700;font-size:14px;margin:14px 0 6px}
input,textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;color:var(--tx);padding:12px 14px;font:inherit;outline:none;transition:.2s}
input:focus,textarea:focus{border-color:var(--ac);box-shadow:0 0 0 3px var(--glow)}
textarea{resize:vertical}
.bad{border-color:#ff6b7a!important}
.err{color:#ff8f9b;font-size:13px;min-height:20px;margin-top:8px}
.modal .btn{width:100%;margin-top:10px}
@media(max-width:900px){
  .links{display:none}
  .stats{grid-template-columns:repeat(2,1fr)}
  .about,.pk{grid-template-columns:1fr}
  .pkg.ultra,.pkg.ultra.rv.in{transform:none}.pkg.ultra:hover{transform:translateY(-6px)}
  section{padding:64px 0}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}
</style>
</head>
<body>
<nav><div class="wrap nav">
  <a class="logo" href="#top" data-go="top">bono<b>.</b>eng</a>
  <div class="links">
    <a href="#about" data-go="about" data-i="nAbout"></a>
    <a href="#packages" data-go="packages" data-i="nPk"></a>
    <a href="#contact" data-go="contact" data-i="nCt"></a>
  </div>
  <div class="lang" role="group" aria-label="Language">
    <button id="bAR" type="button">AR</button><button id="bEN" type="button">EN</button>
  </div>
</div></nav>

<main id="top">
<header class="hero"><div class="wrap">
  <div class="pill rv"><i></i><span data-i="pill"></span></div>
  <h1 class="rv"><span data-i="h1a"></span> <em data-i="h1b"></em></h1>
  <p class="lead rv" data-i="lead"></p>
  <a class="btn rv" href="#packages" data-go="packages" data-i="cta"></a>
  <div class="stats">
    <div class="glass stat rv"><strong><span id="cnt">0</span>+</strong><span data-i="s1"></span></div>
    <div class="glass stat rv"><strong>Team</strong><span data-i="s2"></span></div>
    <div class="glass stat rv"><strong>1–5d</strong><span data-i="s3"></span></div>
    <div class="glass stat rv"><strong>Modern</strong><span data-i="s4"></span></div>
  </div>
</div></header>

<section id="about"><div class="wrap">
  <div class="sec-h rv"><h2 data-i="aH"></h2><p data-i="aP"></p></div>
  <div class="about">
    <div class="glass rv"><div class="ic">⚙️</div><h3 data-i="a1h"></h3><p data-i="a1p"></p></div>
    <div class="glass rv"><div class="ic">⚡</div><h3 data-i="a2h"></h3><p data-i="a2p"></p></div>
    <div class="glass rv"><div class="ic">📈</div><h3 data-i="a3h"></h3><p data-i="a3p"></p></div>
  </div>
</div></section>

<section id="packages"><div class="wrap">
  <div class="sec-h rv"><h2 data-i="pH"></h2><p data-i="pP"></p></div>
  <div class="pk" id="pk"></div>
</div></section>

<section id="contact"><div class="wrap"><div class="glass cta rv">
  <h2 data-i="cH"></h2><p data-i="cP"></p>
  <button class="btn" type="button" id="cBtn" data-i="cB"></button>
</div></div></section>
</main>
<footer><div class="wrap">© <span id="yr"></span> bono.eng — <span data-i="foot"></span></div></footer>

<div class="ov" id="ov" role="dialog" aria-modal="true" aria-labelledby="mT">
  <div class="modal">
    <div class="mh"><h3 id="mT" data-i="mT"></h3><button class="x" type="button" id="xb" aria-label="Close">✕</button></div>
    <div class="sum">
      <div><span data-i="lPk"></span><b id="sPk"></b></div>
      <div><span data-i="lPr"></span><b id="sPr"></b></div>
      <div><span data-i="lTm"></span><b id="sTm"></b></div>
    </div>
    <form id="f" novalidate>
      <label for="fn" data-i="fN"></label><input id="fn" autocomplete="name">
      <label for="fp" data-i="fP"></label><input id="fp" type="tel" inputmode="tel" autocomplete="tel" dir="ltr">
      <label for="fs" data-i="fS"></label><input id="fs">
      <label for="fd" data-i="fD"></label><textarea id="fd" rows="5"></textarea>
      <div class="err" id="err" role="alert"></div>
      <button class="btn" type="submit" data-i="fB"></button>
    </form>
  </div>
</div>

<script>
(function(){
var PH="201055144619";
var T={
ar:{nAbout:"من نحن",nPk:"الباقات",nCt:"تواصل",
pill:"كولكتيف هندسي · أكثر من 600 موقع تم تسليمه",
h1a:"Bono.",h1b:"Eng",
lead:"bono.eng فريق مهندسي برمجيات وويب بخبرة حقيقية. سلّمنا أكثر من 600 موقع في مجالات مختلفة، وكل موقع مبني بدقة هندسية وسرعة وبنية تتحمل النمو.",

cH:"جاهز تبدأ مشروعك؟",cP:"احجز باقتك دلوقتي وتواصل معنا مباشرة على واتساب.",cB:"ابدأ الطلب",
foot:"مجموعة مهندسين لتطوير المواقع",

fN:"الاسم",fP:"الرقم (واتساب)",fS:"اسم الموقع",fD:"وصف دقيق للموقع وفكرته",fB:"إرسال الطلب عبر واتساب",

{n:"الباقة الأولى",t:"موقع عادي",tm:"أسبوع",f:["تصميم نظيف وعصري","متجاوب مع كل الشاشات","صفحات أساسية احترافية","ربط واتساب وتواصل"]},
{n:"الباقة الثانية",t:"موقع احترافي",tm:"أسبوع",f:["تصميم مخصص بالكامل","حركات وتأثيرات تفاعلية","تحسين الأداء والسرعة","جاهز لمحركات البحث (SEO)"],b:"الأكثر طلبًا"},
{n:"الباقة الثالثة",t:"موقع احترافي جدًا",tm:"من يوم لـ 5 أيام",f:["هوية رقمية فاخرة بتفاصيل مخصصة","بنية قابلة للتوسع ومميزات متقدمة","أعلى أداء وأمان","أولوية ودعم مباشر"],b:"الأقوى"}
],
msg:{h:"طلب جديد من موقع bono.eng",pk:"الباقة",pr:"السعر",tm:"مدة التسليم",nm:"الاسم",ph:"الرقم",ws:"اسم الموقع",ds:"وصف الفكرة"}},

a3h:"Built to Scale",a3p:"Sites that handle more traffic and features without starting over.",

foot:"Web Engineering Collective",
mT:"Confirm Your Order",lPk:"Package",lPr:"Price",lTm:"Delivery",
fN:"Name",fP:"Phone / WhatsApp Number",fS:"Desired Website Name",fD:"Detailed Description & Idea",fB:"Send Order via WhatsApp",
eReq:"Please fill in all required fields.",ePh:"Enter a valid phone number.",eDs:"Please describe your idea in more detail (10+ characters).",
cur:"EGP",
pk:[
{n:"Package One",t:"Standard Website",tm:"1 Week",f:["Clean, modern design","Fully responsive","Core professional pages","WhatsApp contact integration"]},
{n:"Package Two",t:"Professional Website",tm:"1 Week",f:["Fully custom design","Interactive motion & effects","Performance optimization","SEO-ready structure"],b:"Most Popular"},
{n:"Package Three",t:"Ultra-Pro Flagship Website",tm:"1 to 5 Days",f:["Premium custom digital identity","Scalable architecture, advanced features","Top performance & security","Priority direct support"],b:"Flagship"}
],
msg:{h:"New order from bono.eng",pk:"Package",pr:"Price",tm:"Delivery Time",nm:"Name",ph:"Phone",ws:"Website Name",ds:"Idea Description"}}
};
var PR=[4000,6000,10000],CL=["","pro","ultra"];
var lang="ar",sel=0;
var $=function(s){return document.querySelector(s)};
function fmt(n){return n.toLocaleString("en-US")}
function render(){
  var d=T[lang];
  document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";
  document.title=lang==="ar"?"bono.eng — كولكتيف هندسة المواقع":"bono.eng — Web Engineering Collective";
  document.querySelectorAll("[data-i]").forEach(function(e){e.textContent=d[e.dataset.i]});
  $("#bAR").classList.toggle("on",lang==="ar");$("#bEN").classList.toggle("on",lang==="en");
  var h="";
  d.pk.forEach(function(p,i){
    h+='<div class="glass pkg '+CL[i]+' rv in">'+(p.b?'<span class="badge">'+p.b+'</span>':'')+
    '<span class="n">'+p.n+'</span><h3>'+p.t+'</h3><div><span class="price">'+fmt(PR[i])+'<small>'+d.cur+'</small></span></div>'+
    '<div class="time">⏱ '+p.tm+'</div><ul>'+p.f.map(function(x){return"<li>"+x+"</li>"}).join("")+'</ul>'+
    '<button class="btn" type="button" data-p="'+i+'">'+(lang==="ar"?"اطلب الآن":"Order Now")+'</button></div>';
  });
  $("#pk").innerHTML=h;
  $("#fn").placeholder=lang==="ar"?"اسمك الكامل":"Your full name";
  $("#fp").placeholder="01XXXXXXXXX";
  $("#fs").placeholder=lang==="ar"?"مثال: متجر الأناقة":"e.g. Elegance Store";
  $("#fd").placeholder=lang==="ar"?"اشرح فكرة الموقع، الأقسام، الألوان، المميزات المطلوبة...":"Describe the idea, sections, colors, and features you need...";
  if($("#ov").classList.contains("open"))fillSum();
  try{localStorage.setItem("bono_lang",lang)}catch(e){}
}
function fillSum(){
  var d=T[lang],p=d.pk[sel];
  $("#sPk").textContent=p.n+" · "+p.t;$("#sPr").textContent=fmt(PR[sel])+" "+d.cur;$("#sTm").textContent=p.tm;
}
function openM(i){sel=i;fillSum();$("#err").textContent="";$("#ov").classList.add("open");setTimeout(function(){$("#fn").focus()},60)}
function closeM(){$("#ov").classList.remove("open")}
$("#bAR").onclick=function(){lang="ar";render()};
$("#bEN").onclick=function(){lang="en";render()};
$("#pk").addEventListener("click",function(e){var b=e.target.closest("[data-p]");if(b)openM(+b.dataset.p)});
$("#cBtn").onclick=function(){openM(1)};
$("#xb").onclick=closeM;
$("#ov").addEventListener("click",function(e){if(e.target.id==="ov")closeM()});
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeM()});
document.querySelectorAll("[data-go]").forEach(function(a){a.addEventListener("click",function(e){
  e.preventDefault();var t=document.getElementById(a.dataset.go);if(t)t.scrollIntoView({behavior:"smooth",block:"start"});
})});
$("#f").addEventListener("submit",function(e){
  e.preventDefault();
  var d=T[lang],ids=["fn","fp","fs","fd"],bad=false;
  ids.forEach(function(i){var el=$("#"+i);var v=el.value.trim();el.classList.toggle("bad",!v);if(!v)bad=true});
  var err=$("#err");
  if(bad){err.textContent=d.eReq;return}
  var ph=$("#fp").value.replace(/[\s\-()+]/g,"");
  if(!/^\d{8,15}$/.test(ph)){$("#fp").classList.add("bad");err.textContent=d.ePh;return}
  var ds=$("#fd").value.trim();
  if(ds.length<10){$("#fd").classList.add("bad");err.textContent=d.eDs;return}
  err.textContent="";
  var p=d.pk[sel],m=d.msg;
  var text="*bono.eng* 🚀\n"+m.h+"\n━━━━━━━━━━━━━━\n"+
    "📦 "+m.pk+": "+p.n+" — "+p.t+"\n"+
    "💰 "+m.pr+": "+fmt(PR[sel])+" "+d.cur+"\n"+
    "⏱ "+m.tm+": "+p.tm+"\n━━━━━━━━━━━━━━\n"+
    "👤 "+m.nm+": "+$("#fn").value.trim()+"\n"+
    "📞 "+m.ph+": "+$("#fp").value.trim()+"\n"+
    "🌐 "+m.ws+": "+$("#fs").value.trim()+"\n"+
    "📝 "+m.ds+":\n"+ds;
  var url="https://wa.me/"+PH+"?text="+encodeURIComponent(text);
  var w=window.open(url,"_blank","noopener");
  if(!w)window.location.href=url;
});
["fn","fp","fs","fd"].forEach(function(i){$("#"+i).addEventListener("input",function(){this.classList.remove("bad")})});
/* reveal + counter */
var io=new IntersectionObserver(function(es){es.forEach(function(en){if(en.isIntersecting){en.target.classList.add("in");io.unobserve(en.target)}})},{threshold:.12});
document.querySelectorAll(".rv").forEach(function(el){io.observe(el)});
(function(){var c=$("#cnt"),t=600,s=null;
  function st(ts){if(!s)s=ts;var k=Math.min((ts-s)/1600,1);c.textContent=Math.round(t*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(st)}
  requestAnimationFrame(st)})();
$("#yr").textContent=new Date().getFullYear();
try{var sv=localStorage.getItem("bono_lang");if(sv==="en"||sv==="ar")lang=sv}catch(e){}
render();
})();
</script>
